; -------------------------------------------------------
; PlayerSpouses.ini
; -------------------------------------------------------

; In vanilla Skyrim, spouses have their own marriage-related role.
; Being married to an NPC does not make them a follower and does not
; give them a normal follower-style trade option.
;
; This file includes all player spouses in the mod's scope by matching
; actors in PlayerMarriedFaction. This makes spouses eligible for Quick Trade,
; so their equipment can be managed even when they are not standard followers.
;
; This is useful for managing the outfit or equipment of a spouse who stays
; at home, and can also help with mods that let spouses travel, accompany
; the player, or fight alongside them.
;
; This file does not make spouses follow you or turn them into followers.
; It only adds actors who are already the player's spouse to the mod's scope.
;
; PlayerMarriedFaction (Plugin: Skyrim.esm, FormID: 000C6472 -> local 0x0C6472)

[IncludeByFaction]
Faction = Skyrim.esm|0x0C6472
