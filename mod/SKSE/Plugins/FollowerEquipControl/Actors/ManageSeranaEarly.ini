; -------------------------------------------------------
; ManageSeranaEarly.ini
; -------------------------------------------------------

; Serana (Dawnguard.esm) travels with the player from Dimhollow Crypt onwards.
; She follows and fights alongside the player, but does not become a proper follower
; until the Prophet quest begins.
;
; Before the Prophet quest begins:
;   - The vanilla trade dialogue option may appear, but she refuses and says
;     she does not trust the player yet; her inventory cannot be accessed.
;   - This mod cannot detect her as a follower and will not manage her equipment.
;
; This file addresses both limitations:
;   1. The [IncludeByNPC] entry places Serana in the mod's scope immediately,
;      so her equipment is managed from the moment she joins you in Dimhollow.
;   2. She is eligible for Quick Trade, so you can trade with her
;      and manage her equipment before the Prophet quest begins.
;
; Once the Prophet quest starts, Serana becomes a proper follower (IsPlayerTeammate),
; and the vanilla trade becomes available. This entry remains harmless:
; the mod deduplicates scope admission, so she is never double-processed.
;
; Serana (Plugin: Dawnguard.esm, FormID: 02002B74 -> local 0x002B74)

[IncludeByNPC]
NPC = Dawnguard.esm|0x002B74
