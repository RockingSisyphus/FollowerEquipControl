; ===============================================================
; FOLLOWER EQUIP CONTROL - ACTOR INCLUSION
; ===============================================================
; Lines beginning with ';' are comments and ignored by the mod.
;
; 
; Follower Equip Control recognises only actors where IsPlayerTeammate is
; true. Some mods do not set that flag on their follower, so this system
; allows you to extend the mod's scope to additional actors by matching them
; based on their base NPC identity, carried keywords, or faction membership.
;
; Drop your own .ini file to include additional actors in the mod's scope.


; ===============================================================
; HOW TO USE
; ===============================================================
; Place one or more .ini files in this directory:
;       SKSE/Plugins/FollowerEquipControl/Actors/
;
; Every .ini file in this folder is loaded independently, so multiple mod authors
; and users can add their own files without conflicts.
;
; The filename is free, call it whatever you like (for example MyCharacter.ini
; or MyModName_Inclusion.ini).
;
; This file is provided as a template. Copy it, rename the copy, and edit that
; new file for your own inclusion rules instead of editing Example.ini directly.
; Example.ini may be replaced when the mod is updated.


; ===============================================================
;  SECTION TYPES
; ===============================================================
; Three section types are available, each accepting a comma-separated list:
;
;   [IncludeByNPC]       NPC     = <token>, ...   Match actors by base NPC identity.
;   [IncludeByKeyword]   Keyword = <token>, ...   Match actors carrying a keyword.
;   [IncludeByFaction]   Faction = <token>, ...   Match all members of a faction.
;
; Sections apply to NPCTrade mode by default.
; Append a dot and a suffix to target a different interaction instead:
;
;   .NPCTrade    NPC trade - default interaction mode, same as no suffix.
;   .Loot        Looting a container or corpse
;   .Steal       Stealing from an owned container
;   .Pickpocket  Pickpocketing an NPC
;
; You will almost never need to use these suffixes; they are provided purely for
; edge cases where a specific mod or interaction explicitly requires them.
;
; Example:
; [IncludeByNPC.Loot]               applies only while looting.
; [IncludeByKeyword.Pickpocket]     applies only while pickpocketing.
; [IncludeByFaction]                applies only while trading.
;
; [IncludeByFaction] and [IncludeByFaction.NPCTrade] are exactly equivalent.


; ===============================================================
; TOKEN FORMAT
; ===============================================================
; Tokens are written in one of two forms:
;
;   EditorID            The EditorID field shown in the Creation Kit and xEdit.
;                       Supported ONLY by [IncludeByKeyword]. NPC and Faction
;                       sections require the Plugin|0xLocalID form because the
;                       runtime does not retain EditorIDs for those form types.
;
;   Plugin|0xLocalID    Precise lookup using the plugin filename and its local
;                       record number (the FormID without the mod index byte).
;                       Supported by all three section types.
;
;   How to find the local ID in xEdit:
;
;       Regular .esp / .esm:    8 digits shown, e.g. 02002B74
;                               Strip the first 2 (mod index)   -> 0x002B74
;
;       Light (ESL) plugin:     FExx0ABC shown
;                               Use the last 3 digits only      -> 0xABC
;                               (ESL local IDs range: 0x000 - 0xFFF)


; ===============================================================
; EXAMPLES
; ===============================================================
;
;
; IncludeByNPC: Match specific NPCs by their base form identity.
;
;   Trade with Serana (Dawnguard) and Frea (Dragonborn) at any time.
;   Both of these DLC characters accompany the player during lengthy questlines
;   without officially becoming full followers (IsPlayerTeammate is not set)
;   until specific story milestones are reached.
;
; [IncludeByNPC]
; NPC = Dawnguard.esm|0x002B74, Dragonborn.esm|0x017934
;
;
; IncludeByKeyword: Match actors carrying specific keywords.
;
;   Mod authors often tagged their followers with unique keywords, or use SPID
;   (Spell Perk Item Distributor) to assign custom keywords to specific groups of NPCs.
;   By including that keyword here, you can include all those NPCs in the mod's scope
;   without needing to list them individually.
;
; [IncludeByKeyword]
; Keyword = MyCustomTownGuardKeyword, MyFollowerMod.esp|0x000800, MyQuestMod.esp|0x000123
;
;
; IncludeByFaction: Match all members of a specific faction.
;
;   Yield To Me - Tyrannic Bounty Hunter allows you to capture defeated enemies.
;   Since these captives are managed by a custom mechanic rather than the vanilla
;   follower system, their IsPlayerTeammate flag is not set by default. If the mod
;   exposes those captives through a shared faction, adding that faction here can
;   let you access their inventory using Quick Trade to manage their equipment
;   and outfits.
;
;   Conquest of Skyrim lets you create your own faction and recruit troops into
;   your army. These troops are managed through the mod's army systems rather than
;   Skyrim's standard follower system, meaning the IsPlayerTeammate flag is not set.
;   If the mod exposes those troops through a shared faction, adding that faction
;   here can let you access their inventory using Quick Trade to manage their equipment.
;
;   The PotentialFollowerFaction (Plugin: Skyrim.esm, FormID: 0005C84D -> local 0x05C84D)
;   contains all NPCs who can potentially become the player's follower. Including this faction
;   allows you to use the Quick Trade shortcut to manage their outfits before you even recruit
;   them.
;
; [IncludeByFaction]
; Faction = Yield_To_Me.esp|0x000000, conquerskyrim.esp|0x000000, Skyrim.esm|0x05C84D


; ===============================================================
; SECTIONS
; ===============================================================

; Match specific actors by their base NPC identity.
; Useful for targeting individual actors regardless of their follower status.
[IncludeByNPC]
NPC =

; Match actors carrying a specific keyword.
; Useful when actors are tagged with a dedicated keyword, for example via SPID.
[IncludeByKeyword]
Keyword =

; Match all current members of a faction.
; Useful when a group of actors is tracked via a shared faction.
[IncludeByFaction]
Faction =
