; ============================================================
; Follower Equip Control - Settings
; ============================================================
; Boolean values: true / false
; Changes take effect after restarting the game.
; If you have SKSE Menu Framework, you can change these in-game
; via the Mod Control Panel (changes apply immediately there).
; ============================================================


[Core]

; Enables or disables all mod features.
; Default: true
EnableMod=true


[UIFeedback]

; Shows short HUD notifications when the mod performs an action on a follower.
; Default: true
EnableNotifications=true

; Plays vanilla UI sounds when the mod performs an action on a follower.
; Default: true
EnableUISounds=true


[Logging]

; Controls how much detail the mod writes to the SKSE log file.
; Values: trace, debug, info, warn, error, critical, off
;   trace    - most verbose, logs all internal events
;   debug    - verbose diagnostic output
;   info     - standard operation messages
;   warn     - warnings only
;   error    - recoverable errors only
;   critical - unrecoverable errors only
;   off      - no logging
; Default: info
LogLevel=info


[ActorScope]

; Extends all mod features to dismissed and former followers.
; When disabled, only followers currently in your party are affected.
; Default: true
AffectFormerFollowers=true

; Includes actors matched by the FollowerEquipControl/Actors/*.ini inclusion rules
; (keyword / NPC / faction) in the mod scope. When disabled, all inclusion rules
; are ignored (third-party follower bridges and scripted-actor admissions are off).
; Default: true
IncludeInclusionActors=true

; Includes player-commanded actors (conjured summons, dead thralls, reanimated
; corpses, mounts) in the mod scope. When disabled, these actors are ignored.
; Default: true
IncludePlayerSummons=true


[QuickTrade]

; Master toggle for Quick Trade (Followers, FormerFollowers, InclusionActors,
; PlayerSummons, KNoneActors, Mounts, QuickTradeAllWorldMounts).
; When disabled, the hotkey is inactive for all actor categories.
; Default: true
EnableQuickTrade=true

; Enables Quick Trade for active followers (IsPlayerTeammate).
; Independent of the other EnableQuickTradeFor* keys.
; Default: true
EnableQuickTradeForFollowers=true

; Enables Quick Trade for former (dismissed) followers no longer IsPlayerTeammate.
; Independent of the other EnableQuickTradeFor* keys.
; Ignored when AffectFormerFollowers=false.
; Default: true
EnableQuickTradeForFormerFollowers=true

; Enables Quick Trade for inclusion actors flagged with the '+' prefix.
; Independent of the other EnableQuickTradeFor* keys.
; Default: true
EnableQuickTradeForInclusionActors=true

; Enables Quick Trade for player-commanded actors (summons, dead thralls, reanimated corpses).
; Independent of the other EnableQuickTradeFor* keys.
; Default: true
EnableQuickTradeForPlayerSummons=true

; Enables Quick Trade for kNone actors (wolves, atronachs, horses) within mod scope.
; Opens trade menu only - no equip features apply to kNone actors.
; The actor must still pass its own category gate (e.g. IncludePlayerSummons).
; Default: true
EnableQuickTradeForKNoneActors=true

; Enables Quick Trade for mounts associated with followers or the player.
; Covers Tier 1 (follower/summon/inclusion actor mounts) and Tier 2 (player's last mount).
; No mod features apply to mounts -- this opens trade menu only.
; Default: true
EnableQuickTradeForMounts=true

; Expands mount Quick Trade to all world mounts (any IsAMount() actor).
; When enabled, every horse and rideable creature becomes eligible, not just
; follower/player-associated mounts.
; Warning: this opens Quick Trade for all rideable creatures in the world.
; Ignored when EnableQuickTradeForMounts=false.
; Default: false
QuickTradeAllWorldMounts=false


[KeyboardControls]

; Controls which key activates mod features while trading with a follower.
; Value is a DirectInput keyboard scan code (decimal).
; https://wiki.nexusmods.com/index.php/DirectX_Scancodes_And_How_To_Use_Them
; Default: 29
ModKeyDik=29

; Overrides SkyUI's Equip Mode key with a custom key.
; SkyUI's config.txt setting for this key does not work for some users, so this is the only way to change it.
; Value is a DirectInput keyboard scan code (decimal). Set to 0 to keep SkyUI's own Equip Mode key.
; Default: 0
SkyuiEquipModeKey=0

; Controls the Quick Trade modifier key (DirectInput scan code).
; Hold this key + press Activate on an eligible actor to open trade directly.
; Set to 0 to use the engine-bound Sprint key as the modifier.
; Default: 0 (use Sprint binding)
QuickTradeKeyDik=0


[GamepadControls]

; Sets the gamepad Mod Key button (SKSE keycode, 266-281).
; Default: 280 (LT / Left Trigger)
GamepadModKey=280

; Sets the gamepad button for right-hand equip while holding the Mod Key.
; Default: 276 (A)
GamepadRightHandKey=276

; Sets the gamepad button for left-hand equip while holding the Mod Key.
; Default: 278 (X)
GamepadLeftHandKey=278

; Controls the Quick Trade modifier button (SKSE gamepad keycode, 266-281).
; Set to 0 to use the engine-bound Sprint gamepad button as the modifier.
; Default: 0 (use Sprint binding)
QuickTradeGamepadKey=0


[ButtonIndicators]

; Adds a Mod Key indicator in the SkyUI bottom bar while trading with a follower.
; Default: true
EnableModKeyIndicator=true

; Sets the text shown on the Mod Key indicator in the SkyUI bottom bar.
; Leave empty to use the localized default from your language file.
; Default: (empty - uses localized default)
ModKeyIndicatorText=

; Sets the text shown on the Mod Key indicator when the target is a list-included actor.
; Leave empty to use the localized default from your language file.
; Default: (empty - uses localized default)
InclusionIndicatorText=

; Sets the text shown on the Mod Key indicator when the target is a player-summoned actor.
; Leave empty to use the localized default from your language file.
; Default: (empty - uses localized default)
SummonIndicatorText=

; Overrides SkyUI's Equip Mode label in the bottom bar while trading with a follower.
; Leave empty to use the localized default from your language file.
; Default: (empty - uses localized default)
EquipModeTextOverride=


[IconAppearance]

; Master toggle for mod icons (CombatEquipIcon, HeadgearIcon, OutfitSyncIcon, HandItemIcon).
; When disabled, no mod icons are shown next to item names in the trade menu.
; Default: true
EnableIconIndicator=true

; Displays an icon next to items in the trade list that have a combat-equip preference set.
; Default: true
EnableCombatEquipIcon=true

; Displays an icon next to the headgear item that is set as the combat headgear preference.
; Default: true
EnableHeadgearIcon=true

; Displays an icon next to armor and clothing saved for outfit restore.
; Default: true
EnableOutfitSyncIcon=true

; Displays an icon next to weapons, shields, scrolls, and ammo saved for hand-item restore.
; Default: true
EnableHandItemIcon=true

; Master toggle for icon customization (IconSize, GapAfterText, GapAfterIcon, FecIconSpacing).
; When disabled, icon sizes and spacing use built-in defaults.
; Default: true
EnableCustomization=true

; Sets the width and height (in pixels) of mod icons shown next to item names.
; Ignored when EnableCustomization=false.
; Default: 12.0
IconSize=12

; Sets the horizontal gap (in pixels) after the item name text field when no other icons are present.
; Ignored when EnableCustomization=false.
; Default: 8.0
GapAfterText=8

; Sets the horizontal gap (in pixels) after the rightmost non-mod icon (SkyUI, DIII, etc.).
; Effective gap = stored value - 6.0 (default 8.0 => 2px effective gap).
; Ignored when EnableCustomization=false.
; Default: 8.0
GapAfterIcon=8

; Sets the horizontal gap (in pixels) between adjacent mod icons.
; Ignored when EnableCustomization=false.
; Default: 8.0
FecIconSpacing=8


[EquipModeItems]

; Master toggle for equip-mode items (Weapons, Armor, Ammo, Torches, Scrolls).
; Hold the Mod Key and click an item to equip or unequip it.
; When disabled, the Mod Key equip action is inactive for all item types.
; Default: true
Enable=true

; Allows weapons to be equipped on followers.
; Default: true
EnableWeapons=true

; Allows armor and shields to be equipped on followers.
; Default: true
EnableArmor=true

; Allows ammo (arrows and bolts) to be equipped on followers.
; Default: true
EnableAmmo=true

; Allows torches to be equipped on followers.
; Default: true
EnableTorches=true

; Allows scrolls to be equipped on followers.
; Default: true
EnableScrolls=true


[EquipModeConsumableMode]

; Master toggle for consumable mode (Potions, Foods, Drinks, Ingredients).
; Hold the Mod Key and click a consumable to make the follower consume it.
; When disabled, the Mod Key consume action is inactive for all consumable types.
; Default: true
EnableConsumableMode=true

; Allows potions to be consumed by followers.
; Default: true
EnablePotions=true

; Allows food to be consumed by followers.
; Default: true
EnableFoods=true

; Allows drinks to be consumed by followers.
; Default: true
EnableDrinks=true

; Allows ingredients to be consumed by followers.
; Default: true
EnableIngredients=true

; Lets the player learn the first alchemy effect when a follower consumes an ingredient.
; Default: false
EnableIngredientDiscoveryForPlayer=false


[EquipModePoisonMode]

; Controls what happens when you click a poison while holding the Mod Key.
; Values: applyToWeapon, consume, disable
;   applyToWeapon - applies the poison to the follower's equipped weapon
;   consume       - the follower consumes the poison
;   disable       - transfers the poison normally
; Default: applyToWeapon
Mode=applyToWeapon

; Enables poison charge stacking when Mode = applyToWeapon.
; When disabled, clicking a poison on an already-poisoned weapon is blocked.
; Default: false
EnablePoisonStacking=false

; Sets the maximum number of poison charges that can be stacked.
; 1-99 = charge cap, 100 = unlimited.
; Ignored when EnablePoisonStacking=false.
; Default: 100
MaxPoisonCharges=100


[EquipModeSpellTomeMode]

; Allows followers to learn spells from tomes while trading.
; Hold the Mod Key and click a spell tome to teach the spell.
; Default: true
EnableSpellTomeMode=true

; Prevents spell tomes from being consumed when teaching spells to followers.
; Default: false
DoNotConsumeSpellTomes=false


[CombatEquipPreference]

; Makes followers prefer the gear you selected when the game chooses what to equip in combat.
; Does not force-equip; gives your selection a strong advantage in the game's evaluation.
; Default: true
EnableScoring=true

; Tries to equip the exact version of a preferred item (matching temper, enchantment, etc.),
; not just any copy of the same base item.
; Default: true
EnableInstanceAlign=true

; Clears a saved preference when you unequip that item from a follower during trade.
; Covers all slots except the left hand (see below).
; Default: false
EnableClearPreferencesOnUnequip=false

; Clears the left-hand preference when you unequip a left-hand item during trade.
; Separate from the above because shield/off-hand choices are often more deliberate.
; Default: false
EnableClearLeftHandPreferenceOnUnequip=false


[CombatEquipEnforcement]

; Forces followers to keep the melee weapons and shields you selected during combat.
; Blocks AI swaps. Only melee weapons and shields are covered.
; Default: true
EnableMeleeEnforcement=true

; Clears any hand-slot with no saved preference or whose preferred item is no longer in inventory.
; Useful with unarmed combat mods when you want to leave a hand deliberately empty.
; Ignored when EnableMeleeEnforcement=false.
; Default: false
EnableMeleeEnforcementEmptyHand=false

; Makes followers use the arrows or bolts you selected, overriding automatic ammo switching.
; Default: true
EnableAmmoPreference=true


[CombatEquipRestore]

; Restores the follower's pre-combat equipment (weapons, shield, ammo, empty hands) when combat ends.
; Default: true
EnableRestorePreCombatOnExit=true

; Equips the selected headgear when combat starts and restores pre-combat state when combat ends.
; Covers helmets, hoods, and circlets.
; Default: false
EnableHeadgearAutoEquip=false

; Prevents followers from consuming ammo when firing ranged weapons.
; Followers will never run out of arrows or bolts.
; Default: false
EnableInfiniteAmmo=false


[OutfitSync]

; Prevents the game from re-dressing the follower in their default outfit
; after inventory resets or area transitions.
; Default: true
EnableUpdateNpcOutfitSuppression=true

; Re-equips the armor and clothing you last chose for the follower
; after the game rebuilds their outfit (save/load, fast travel, area transitions).
; Default: true
EnableOutfitSnapshotRestore=true

; Lets external mods (SPID, NFF, Simple Outfit Framework, Papyrus scripts,
; AI packages, etc.) change the follower's outfit.
; Default: true
AllowOutfitChanges=true


[HiddenItems]

; Master toggle for all non-playable item handling (Armor, Weapon, Ammo).
; When disabled, all three handling modes are skipped for followers.
; Default: true
EnableNonPlayableItems=true

; Removes non-playable armor from the follower's inventory when you open trade.
; Warning: May conflict with mods that use non-playable armor pieces for internal purposes.
; Default: false
RemoveHiddenArmor=false

; Removes non-playable weapons and shields from the follower's inventory when you open trade.
; Warning: Removed items are not restored if this setting is later disabled.
; Default: true
RemoveHiddenWeapon=true

; Removes non-playable ammo from the follower's inventory when you open trade.
; Warning: Removed items are not restored if this setting is later disabled.
; Default: true
RemoveHiddenAmmo=true

; Master toggle for outfit item visibility (EnableRevealDefaultOutfitItems, EnableRevealExternalOutfitItems).
; When disabled, outfit items are not revealed in the trade list.
; Default: true
EnableOutfitItems=true

; Makes default outfit items visible in the trade list when you open trade.
; Worn items are revealed; surplus unworn copies are removed.
; Default: true
EnableRevealDefaultOutfitItems=true

; Makes outfit items distributed by external mods (e.g. SPID) visible in the trade list.
; These mods use the same outfit-hiding system, so their items appear hidden by default.
; Default: true
EnableRevealExternalOutfitItems=true


[ItemInjectionBlocking]

; Prevents the game from adding armor pieces from a follower's default outfit to their inventory.
; Default: false
EnableOutfitItemBlocker=false

; Prevents the game from adding leveled list items (weapons, ammo, potions, etc.)
; to follower inventories.
; Default: false
EnableLeveledItemBlocker=false


[LootBlocking]

; Stops followers from seeking out and grabbing weapons during combat.
; Default: true
EnablePreventCombatLoot=true

; Stops followers from looting weapons and ammo from containers and corpses.
; Default: false
EnablePreventContainerLoot=false

; Stops followers from picking up loose items from the ground.
; Default: false
EnablePreventPickupObject=false


[AutoEquipBlocking]

; Prevents followers from automatically equipping weapons, shields, scrolls, or ammo outside combat
; (e.g. after fast travel or location change).
; Default: true
EnableNonCombatEquipBlocker=true

; Re-equips the right-hand, left-hand, and ammo selections you saved for a follower after the game strips their hand items outside of combat.
; Default: true
EnableHandItemRestore=true

; Stops the game from automatically equipping what it considers the best weapon
; on the follower during trade.
; Default: true
EnableBestWeaponAutoEquipSuppressor=true


[EquipGate]

; Blocks ALL item equips on followers that are not performed by this mod.
; Warning: May conflict with other mods that manage follower equipment.
; Default: false
EnableEquipBlocking=false

; Blocks ALL item unequips on followers that are not performed by this mod.
; Warning: May conflict with other mods that manage follower equipment.
; Default: false
EnableUnequipBlocking=false

; Allows followers to equip and unequip torches even when blocking is active.
; Ignored when both EnableEquipBlocking=false and EnableUnequipBlocking=false.
; Default: true
NeverBlockTorchEquip=true


[WeaponEnchantmentRecharge]

; Enables recharging enchanted weapons while trading with a follower.
; Select an enchanted weapon and press the Recharge Key.
; Default: true
EnableRecharge=true

; Sets the key for recharging enchanted weapons (DirectInput scan code).
; Default: 20
RechargeKeyDik=20

; Sets the gamepad button for recharging while holding the Mod Key (SKSE keycode, 266-281).
; Default: 279 (Y)
GamepadRechargeKey=279

; Adds a Recharge Key indicator in the SkyUI bottom bar when an enchanted weapon is selected.
; Default: true
EnableUIIndicator=true

; Master toggle for advanced soul gem display (ShowStackCount, ContainedSoulDisplayMode, SourceDisplayMode).
; When disabled, the soul gem picker shows basic gem names only.
; Default: true
AdvancedSoulGemDisplay=true

; Adds a (count) suffix for stacked soul gems in the picker.
; Ignored when AdvancedSoulGemDisplay=false.
; Default: true
ShowStackCount=true

; Controls when the contained-soul level is shown in the picker.
; Values: disable, lower_only, always
;   disable    - never show the contained soul
;   lower_only - show only when the soul is lower than the gem's capacity
;   always     - always show the contained soul
; Ignored when AdvancedSoulGemDisplay=false.
; Default: lower_only
ContainedSoulDisplayMode=lower_only

; Controls which inventory source tags are shown for soul gems.
; Values: disable, follower, player, both
;   disable  - no source tags
;   follower - tag only the follower's gems
;   player   - tag only the player's gems
;   both     - tag both inventories
; Ignored when AdvancedSoulGemDisplay=false.
; Default: disable
SourceDisplayMode=disable

; Controls how the soul gem picker is sorted.
; Values: name, soul_asc, soul_desc
;   name      - alphabetical, similar to vanilla
;   soul_asc  - by contained soul level, lowest first
;   soul_desc - by contained soul level, highest first
; Ignored when AdvancedSoulGemDisplay=false.
; Default: soul_asc
SoulGemSortMode=soul_asc


[StatsDisplay]

; Controls where follower stats (carry weight, gold, health/magicka/stamina) are shown.
; Values: disable, follower_side, always
;   disable       - does not override the stats display
;   follower_side - shows follower stats only on the Take tab
;   always        - shows follower stats on both the Take and Give tabs
; Default: follower_side
EnableFollowerStatsInTradeMenu=follower_side


[CorpseEquipMode]

; Allow equipping and unequipping items on dead NPCs (corpses) while looting.
; Hold the Mod Key and click an item to equip/unequip it on the corpse.
; Default: true
Enable=true

; Sets the text shown on the bottom bar indicator when looting a corpse.
; Leave empty to use the localized default from your language file.
; Default: (empty - uses localized default)
IndicatorText=


[EngineFixes]

; Fixes Give-tab items that cannot be transferred caused by a corrupt engine weight cache.
; Corrects the stuck carry weight when the trade menu opens and after each item transfer.
; Default: true
EnableStaleWeightCacheFix=true


[SkyUIFixes]

; Skips the quantity prompt during Mod Key actions and SkyUI equip mode.
; Since these actions always target a single item, the prompt is unnecessary.
; Default: true
EnableQuantityMenuBlocker=true

; Forces a quantity prompt when transferring weightless items (gold, lockpicks, etc.)
; from a follower, so you can choose the exact amount instead of taking the entire stack.
; Default: true
EnableZeroWeightFix=true

