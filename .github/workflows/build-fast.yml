name: build-fast

# 与 build.yml 完全等价的产物，但针对"冷编译很慢"做了加速：
#   1) vcpkg 依赖走二进制缓存（避免每次从源码重编 fmt/spdlog/detours/xbyak）
#   2) 把 vcpkg 依赖安装提前并显式化，便于日志分辨"安装"与"编译"
#   3) 关闭插件目标的 LTCG/IPO（链接期代码生成很慢；对 mod 无收益）
#   4) 编译阶段计时，便于和慢速版本对比
# 目的：与 build.yml 并行跑，谁先产出可用 DLL 就用谁。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  VCPKG_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

jobs:
  build-fast:
    runs-on: windows-2022
    # Guard rail: with IPO disabled the whole build is ~470 translation units
    # (measured ~2.2 s each) plus linking, so anything past this is a real hang.
    timeout-minutes: 90

    steps:
      - name: Checkout (with CommonLibSSE-NG submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix CommonLib template member typos for clang
        shell: pwsh
        run: git -C extern/CommonLibSSE-NG apply ../../cmake/patches/commonlib-clang.patch

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = "C:\vcpkg" }
          if (-not (Test-Path $root)) { throw "vcpkg not found at $root" }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using vcpkg at $root"

      - name: Slot-resolution test (fails if the fix regresses)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/test_slot_resolution.py
          if ($LASTEXITCODE -ne 0) { throw "slot resolution test failed" }

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-windows-static-md-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-md-

      - name: Install vcpkg dependencies (cached)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:VCPKG_BINARY_CACHE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:VCPKG_DEFAULT_BINARY_CACHE = $env:VCPKG_BINARY_CACHE
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static-md --x-manifest-root=. --x-install-root=build/vcpkg_installed
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host "vcpkg install elapsed: $($sw.Elapsed.TotalSeconds.ToString('0.0'))s (exit=$code)"
          if ($code -ne 0) { throw "vcpkg install failed" }

      - name: Configure (CMake preset Skyrim, IPO off)
        shell: pwsh
        run: |
          # SKSE_ENABLE_IPO=OFF strips MSVC /GL + /LTCG. Whole-program optimisation is
          # what made this build take hours on a 2-core runner; it buys a mod nothing.
          cmake --preset Skyrim -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release -DSKSE_ENABLE_IPO=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_CXX_COMPILER:|^SKSE_ENABLE_IPO:' | ForEach-Object { $_.Line }
          # Prove /GL (link-time codegen) is absent from the Release commands we will
          # actually run. Scanning every ninja file is wrong: Debug/RelWithDebInfo/
          # MinSizeRel keep /GL and we never build them. A dry run of Release is exact.
          foreach ($t in @("CommonLibSSE", "FollowerEquipControl")) {
            $dry = & cmake --build build --config Release --target $t -- -n -v 2>&1
            $hits = $dry | Select-String -Pattern '/GL' -SimpleMatch
            Write-Host "$t : dry-run lines=$($dry.Count) /GL hits=$($hits.Count)"
            if ($hits) {
              $hits | Select-Object -First 5 | ForEach-Object { Write-Host $_.Line }
              throw "/GL is still present in the Release commands for $t"
            }
          }
          Write-Host "verified: no /GL in Release commands for CommonLibSSE or FollowerEquipControl"

      - name: Compile settings UI first
        timeout-minutes: 10
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $target = "CMakeFiles/FollowerEquipControl.dir/Release/src/core/settings/MenuFrameworkSettings.cpp.obj"
          & ninja -C build -f build-Release.ninja -t commands $target | Set-Content settings-commands.log
          Get-Content settings-commands.log
          $proc = Start-Process ninja -ArgumentList @('-C', 'build', '-f', 'build-Release.ninja', '-v', $target) -NoNewWindow -PassThru -RedirectStandardOutput settings-build.log -RedirectStandardError settings-error.log
          while (-not $proc.WaitForExit(30000)) {
            Get-Process cl, clang-cl, c1xx, c2, ninja -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, CPU, WorkingSet64 | Format-Table | Out-String | Tee-Object -FilePath settings-process.log -Append | Write-Host
            Get-CimInstance Win32_Process -Filter "Name='cl.exe' OR Name='clang-cl.exe'" | Select-Object ProcessId, ParentProcessId, CommandLine | Format-List | Out-String | Tee-Object -FilePath settings-process.log -Append | Write-Host
          }
          Get-Content settings-build.log
          Get-Content settings-error.log
          if ($proc.ExitCode -ne 0) { throw "Settings UI compilation failed ($($proc.ExitCode))" }
          Write-Host "Settings UI compiled in $($sw.Elapsed.TotalSeconds)s"

      - name: Build (Release) with live progress
        shell: pwsh
        run: |
          # Stream the build output straight into the job log with Tee-Object so
          # progress is visible while the job runs (a background Start-Job hides it
          # until completion, which made earlier timeouts impossible to diagnose).
          $log = Join-Path $PWD "build-full.log"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          Write-Host "=== build start $(Get-Date -Format u) ==="
          cmake --build build --config Release --verbose 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host "=== build finished in $($sw.Elapsed.TotalSeconds.ToString('0.0'))s (exit=$code) ==="
          if (Test-Path $log) {
            $lines = Get-Content $log
            $last = ($lines | Select-String -Pattern '^\[\d+/\d+\]' | Select-Object -Last 1).Line
            Write-Host "last progress: $last"
            Write-Host "--- linking lines ---"
            $lines | Select-String -Pattern 'Linking' | ForEach-Object { $_.Line }
          }
          if ($code -ne 0) {
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 60 }
            throw "build failed (exit=$code)"
          }
          $dll = Get-ChildItem -Recurse build -Filter FollowerEquipControl.dll | Select-Object -First 1
          if (-not $dll) { throw "FollowerEquipControl.dll not produced" }
          Write-Host "DLL: $($dll.FullName) ($($dll.Length) bytes)"

      - name: Verify the built DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter FollowerEquipControl.dll |
                   Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Recurse build -Filter FollowerEquipControl.dll | Select-Object -First 1 }
          if (-not $dll) { throw "FollowerEquipControl.dll was not produced" }
          Write-Host "DLL: $($dll.FullName) ($($dll.Length) bytes)"
          Write-Host "FileVersion: $((Get-Item $dll.FullName).VersionInfo.FileVersion)"
          "DLL_PATH=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package installable mod folder
        shell: pwsh
        run: |
          $out = "dist/Follower Equip Control SKSE"
          New-Item -ItemType Directory -Force -Path "$out/SKSE/Plugins/FollowerEquipControl" | Out-Null
          Copy-Item "$env:DLL_PATH" "$out/SKSE/Plugins/FollowerEquipControl.dll" -Force
          Copy-Item "mod/SKSE/Plugins/FollowerEquipControl.ini" "$out/SKSE/Plugins/" -Force
          Copy-Item "mod/SKSE/Plugins/FollowerEquipControl/*" "$out/SKSE/Plugins/FollowerEquipControl/" -Recurse -Force
          Copy-Item "mod/Interface" "$out/Interface" -Recurse -Force
          Get-FileHash "$out/SKSE/Plugins/FollowerEquipControl.dll" -Algorithm SHA256 | Format-List | Out-String | Write-Host

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-full.log
            settings-*.log
            build/CMakeCache.txt
            build/CMakeFiles/impl-Release.ninja
            build/CMakeFiles/rules.ninja
          if-no-files-found: warn

      - name: Upload DLL only
        uses: actions/upload-artifact@v4
        with:
          name: FollowerEquipControl-dll-fast
          path: ${{ env.DLL_PATH }}
          if-no-files-found: error

      - name: Upload installable mod folder
        uses: actions/upload-artifact@v4
        with:
          name: FollowerEquipControl-mod-fast
          path: dist/Follower Equip Control SKSE
          if-no-files-found: error

      - name: Report cache size
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:VCPKG_BINARY_CACHE) {
            $size = (Get-ChildItem -Recurse $env:VCPKG_BINARY_CACHE | Measure-Object -Property Length -Sum).Sum
            Write-Host "vcpkg binary cache size: $([math]::Round($size/1MB,1)) MB"
          }
